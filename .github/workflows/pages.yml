name: Deploy Squadrone su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Come corsi SMAM: READ_PAT iniettato al build, gli utenti non lo digiano.
      - name: Inject READ_PAT into config.js
        env:
          READ_PAT: ${{ secrets.READ_PAT }}
        run: |
          if [ -z "$READ_PAT" ]; then
            echo "::error::Secret READ_PAT mancante (Contents R/W su squarone-data), come su corsi."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, pathlib
          cfg = {
            "owner": "rdagmr98",
            "repo": "squadrone-data",
            "branch": "main",
            "pat": os.environ["READ_PAT"],
            "adminPin": "1234",
          }
          pathlib.Path("js/config.js").write_text(
              "/* generated by Actions — do not edit */\n"
              "window.SQUADRONE_CONFIG = " + json.dumps(cfg, indent=2) + ";\n",
              encoding="utf-8",
          )
          print("config.js written")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
