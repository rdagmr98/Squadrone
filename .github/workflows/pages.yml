name: Deploy Squadrone su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Come corsi/AVES: PAT iniettato al build — gli utenti non lo digitano.
      # Preferisce SQUADRONE_PAT; fallback READ_PAT (stesso nome di corsi).
      - name: Inject PAT into config.js
        env:
          SQUADRONE_PAT: ${{ secrets.SQUADRONE_PAT }}
          READ_PAT: ${{ secrets.READ_PAT }}
        run: |
          PAT="${SQUADRONE_PAT:-$READ_PAT}"
          if [ -z "$PAT" ]; then
            echo "::error::Serve secret SQUADRONE_PAT (o READ_PAT) con Contents R/W su squarone-data."
            exit 1
          fi
          export PAT
          python3 - <<'PY'
          import json, os, pathlib
          cfg = {
            "owner": "rdagmr98",
            "repo": "squadrone-data",
            "branch": "main",
            "pat": os.environ["PAT"],
            "adminPin": "1234",
          }
          pathlib.Path("js/config.js").write_text(
              "/* generated by Actions — do not edit */\n"
              "window.SQUADRONE_CONFIG = " + json.dumps(cfg, indent=2) + ";\n",
              encoding="utf-8",
          )
          print("config.js written with injected PAT")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
